<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Karta · 堆叠调节台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><strong>Karta</strong><span class="divider"></span><h1>堆叠调节台</h1></div><div class="header-actions"><button id="reset">重置</button><button id="save" class="primary">保存最终参数</button></div></header>
<main>
<aside class="panel inspector" aria-label="堆叠参数">
<section><h2>卡片宽高缩放倍率</h2>
<p class="muted description" id="cross-description"></p>
<div class="field main-field"><label for="cross-main-range">主窗口</label><div class="number-wrap"><input id="cross-main-number" aria-label="主窗口缩放倍率" type="number" min="0.1" max="2" step="0.01"><span>×</span></div><input id="cross-main-range" aria-label="主窗口缩放倍率滑块" type="range" min="0.1" max="2" step="0.01"></div>
<div class="field secondary-field"><label for="cross-secondary-range">次窗口 · 相对主窗口</label><div class="number-wrap"><input id="cross-secondary-number" aria-label="次窗口 · 相对主窗口缩放倍率" type="number" min="0.1" max="1" step="0.01"><span>×</span></div><input id="cross-secondary-range" aria-label="次窗口 · 相对主窗口缩放倍率滑块" type="range" min="0.1" max="1" step="0.01"></div>
<div class="field others-field"><label for="cross-others-range">其他窗口 · 每层递减</label><div class="number-wrap"><input id="cross-others-number" aria-label="其他窗口 · 每层递减缩放倍率" type="number" min="0.1" max="1" step="0.01"><span>×</span></div><input id="cross-others-range" aria-label="其他窗口 · 每层递减缩放倍率滑块" type="range" min="0.1" max="1" step="0.01"></div>
<p id="cross-summary" class="muted description"></p>
<p class="hint">主窗口以预览区域为基准；次窗口乘主窗口倍率。其他窗口以次窗口尺寸为基准，在主窗口两侧分别由近到远逐层相乘，1× 表示不递减。卡片居中，超出区域部分裁切。</p>
</section>
<section><h2>堆叠轴露出比例</h2><p class="muted description">沿堆叠方向的可见占比，<br>不是窗口本身的大小。</p>
<div id="share-bar" class="share-bar" aria-label="比例合计百分之百"></div>
<div class="field main-field"><label for="main-range">主窗口</label><div class="number-wrap"><input id="main-number" aria-label="主窗口百分比" type="number" min="35" max="94" step="0.1"><span>%</span></div><input id="main-range" aria-label="主窗口比例滑块" type="range" min="35" max="94" step="0.1"></div>
<div class="field secondary-field"><label for="secondary-range">次窗口</label><div class="number-wrap"><input id="secondary-number" aria-label="次窗口百分比" type="number" min="5" max="49.5" step="0.1"><span>%</span></div><input id="secondary-range" aria-label="次窗口比例滑块" type="range" min="5" max="49.5" step="0.1"></div>
<div class="field others-field"><label for="others-range">其他窗口 · 合计</label><div class="number-wrap"><input id="others-number" aria-label="其他窗口合计百分比" type="number" min="1" max="30" step="0.1"><span>%</span></div><input id="others-range" aria-label="其他窗口比例滑块" type="range" min="1" max="30" step="0.1"></div>
<p class="hint">调整任意一项，其余自动平衡至 100%。</p>
</section>
<section><h2>快速预设</h2><div class="presets"><button data-preset="65,28,7">65 / 28 / 7</button><button data-preset="70,25,5">70 / 25 / 5</button><button data-preset="75,20,5">75 / 20 / 5</button></div><button id="baseline" class="text-button">载入当前插件比例 <span aria-hidden="true">↗</span></button></section>
<section class="settings"><h2>预览设置</h2>
<label class="setting">窗口数量<select id="count" aria-label="窗口数量"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
<div class="setting"><span>堆叠方向</span><div class="segmented" role="group" aria-label="堆叠方向"><button id="row" aria-pressed="true">纵向</button><button id="column" aria-pressed="false">横向</button></div></div>
<label class="setting"><span id="extent-label">预览高度</span><span class="extent-wrap"><input id="extent" aria-label="预览轴长度" type="number" min="400" max="2400" step="10"><span class="muted">px</span></span></label>
<label class="setting">窗口标签<input type="checkbox" role="switch" id="labels"></label>
<label class="setting">区域标尺<input type="checkbox" role="switch" id="ruler"></label>
<div class="peek-detail"><span>每个窄边</span><strong id="peek-size"></strong><small id="peek-hint"></small></div>
</section>
</aside>
<div class="workspace">
<section class="panel preview-panel" aria-labelledby="preview-title"><div class="preview-toolbar"><h2 id="preview-title">实时预览</h2><div class="navigation"><button id="previous">上一个 <kbd>↑</kbd></button><button id="next">下一个 <kbd>↓</kbd></button></div></div>
<div id="karta" class="karta" tabindex="0" aria-label="堆叠预览，点击窗口或使用方向键切换"><div id="stage"></div><div id="measure" aria-hidden="true"></div></div>
<div class="preview-footer"><span id="focus-caption"></span><span class="muted">点击露出的窗口，或用 <kbd>↑ ↓</kbd> 切换</span></div>
</section>
<section class="panel output-panel"><div class="output-line"><h2>最终参数</h2><div id="summary" class="summary"></div><div class="output-actions"><button id="copy">复制参数</button><button id="export">导出 JSON</button></div></div><div class="save-line"><span id="status" role="status" aria-live="polite">尚未保存最终参数</span><span class="muted">预览不会改动桌面插件</span></div></section>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.mjs"></script>
</body></html>
