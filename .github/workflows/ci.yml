name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  script-tests:
    name: Lua, JS, and Python script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lua keybind tests
        run: lua5.4 tests/canvas_keybinds_tests.lua

      - name: Run stack-tuner JS tests
        run: node --test tools/stack-tuner/model.test.mjs

      - name: Check Python repro scripts syntax
        run: python3 -m py_compile scripts/*.py tools/stack-tuner/server.py

  cpp-build-and-tests:
    name: C++ Debug + ASan/UBSan build & logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: hyprland

      - name: Build plugin and run sanitized logic tests
        run: |
          nix develop --command bash -lc '
            cmake -B ./ci-build -DCMAKE_BUILD_TYPE=Debug -DHYPRCANVAS_ENABLE_SANITIZERS=ON
            cmake --build ./ci-build -j
            ctest --test-dir ./ci-build --output-on-failure
          '
