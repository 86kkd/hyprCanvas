name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  script-tests:
    name: Lua, JS, and Python script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Lua keybind tests
        run: lua5.4 tests/karta_keybinds_tests.lua

      - name: Run stack-tuner JS tests
        run: node --test tools/stack-tuner/model.test.mjs

      - name: Check Python repro scripts syntax
        run: python3 -m py_compile scripts/*.py tools/stack-tuner/server.py

  cpp-build-and-tests:
    name: C++ Debug + ASan/UBSan build & logic tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v7

      - name: Install Hyprland and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake pkgconf mesa hyprland spdlog lua pixman libdrm

      - name: Build plugin and run sanitized logic tests
        run: |
          cmake -B ./ci-build -DCMAKE_BUILD_TYPE=Debug -DKARTA_ENABLE_SANITIZERS=ON
          cmake --build ./ci-build -j"$(nproc)"
          ctest --test-dir ./ci-build --output-on-failure
